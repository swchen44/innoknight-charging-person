# 一次性診斷 workflow：在 GitHub Actions runner 上完整記錄 headful Chrome
# 能否開啟 CDP remote-debugging-port，作為「為何不能用 headless:false」的第一手證據。
# 手動觸發、不含任何 Secrets、只連本機 about:blank（不碰 InnoKnight）。
# 診斷完成、結論寫入 docs/PDCA.md 後即可刪除此檔。
name: diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headful-cdp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Install xvfb & dbus
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11

      - name: Environment facts
        run: |
          echo "chrome-path: ${{ steps.chrome.outputs.chrome-path }}"
          "${{ steps.chrome.outputs.chrome-path }}" --version || true
          echo "ubuntu: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          echo "DISPLAY=$DISPLAY  DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"

      - name: Probe headful CDP variants (full logs)
        run: |
          CHROME='${{ steps.chrome.outputs.chrome-path }}'
          probe () {
            name="$1"; shift
            echo ""
            echo "########## VARIANT: $name ##########"
            echo "flags: $*"
            rm -rf "/tmp/p-$name"; mkdir -p "/tmp/p-$name"
            ( "$@" --remote-debugging-port=9333 --remote-allow-origins='*' \
                --user-data-dir="/tmp/p-$name" about:blank ) > "/tmp/p-$name.log" 2>&1 &
            pid=$!
            ok=""
            for i in $(seq 1 12); do
              sleep 1
              if curl -sf http://127.0.0.1:9333/json/version >/dev/null 2>&1; then ok="$i"; break; fi
              kill -0 $pid 2>/dev/null || { echo "[$name] process EXITED early after ${i}s"; break; }
            done
            if [ -n "$ok" ]; then
              echo "[$name] >>> CDP OK after ${ok}s <<<"
              curl -s http://127.0.0.1:9333/json/version
            else
              echo "[$name] >>> CDP FAILED <<<"
            fi
            echo "--- full chrome log ($name) ---"
            cat "/tmp/p-$name.log" || true
            kill $pid 2>/dev/null || true
            pkill -f "remote-debugging-port=9333" 2>/dev/null || true
            sleep 1
          }

          # A) headful under xvfb-run（原專案 headless:false 的等價作法）
          probe headful-xvfb        xvfb-run -a "$CHROME" --no-sandbox --disable-dev-shm-usage
          # B) headful + 關掉可能卡住的桌面服務
          probe headful-xvfb-lean   xvfb-run -a "$CHROME" --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --no-default-browser-check
          # C) headful 直接啟動、手動起 dbus session（排除 dbus 缺失的干擾）
          probe headful-dbus        dbus-run-session -- xvfb-run -a "$CHROME" --no-sandbox --disable-dev-shm-usage
          # D) 對照組：headless=new（已知可行）
          probe headless-new        "$CHROME" --no-sandbox --disable-dev-shm-usage --headless=new
