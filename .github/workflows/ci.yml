# 單元測試 CI：只跑 tests/unittest（不需要任何憑證）。
# tests/integration 需要真實帳號，只透過 daily-schedule workflow 或本機手動執行。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install package with dev dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unittest -v
