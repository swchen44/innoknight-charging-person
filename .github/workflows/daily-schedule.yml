# 每日充電預約 workflow（docs/design.md 場景一 Use Case 1）
#
# - 手動觸發（workflow_dispatch）：預設 dry-run，勾選 apply 才會真的寫入。
#   Phase 2 的 go/no-go 驗證就是手動觸發 dry-run。
# - 排程觸發（schedule）：Phase 4 已啟用。UTC 14:05 = 台北 22:05（前一晚），
#   target_date = 明天——結構性避開 GitHub 排程觸發器最高 2 小時的延遲。
#   排程觸發一律視為正式執行（--execute）。
#   辨識期：充電時段用 Variables 設為 07:00-10:00（非離峰），與原自管主機的
#   00:30-06:00 區分，供人工核對雲端版是否設定成功；兩邊並行、原主機不停。
#
# 瀏覽器：預設 headful（指紋較真實，為了通過 reCAPTCHA），需要 Xvfb 提供虛擬顯示；
# 程式已自動帶入 --disable-gpu（runner 無 GPU，headful 少了它會卡 CDP 逾時，2026-08 實測）。
#
# 供應鏈規則：所有第三方 Action 釘死完整 commit SHA，permissions 最小化。
# 公開 repo 注意：本 workflow 的 log 全世界可讀；裝置名稱屬個人資訊，
# 因此放 Secrets（自動遮罩），不放 Variables。
name: daily-schedule

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "實際寫入 InnoKnight（不勾 = dry-run，只讀不寫）"
        type: boolean
        default: false
  schedule:
    - cron: "5 14 * * *"  # UTC = 台北 22:05（前一晚），target_date = 明天

permissions:
  contents: read

concurrency:
  group: daily-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Install xvfb（headful 需要虛擬顯示）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Run daily charging schedule
        env:
          PYTHONUNBUFFERED: "1"
          INNOKNIGHT_USERNAME: ${{ secrets.INNOKNIGHT_USERNAME }}
          INNOKNIGHT_PASSWORD: ${{ secrets.INNOKNIGHT_PASSWORD }}
          INNOKNIGHT_DEVICE_NAME: ${{ secrets.INNOKNIGHT_DEVICE_NAME }}
          INNOKNIGHT_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          INNOKNIGHT_START_TIME: ${{ vars.INNOKNIGHT_START_TIME || '00:30' }}
          INNOKNIGHT_END_TIME: ${{ vars.INNOKNIGHT_END_TIME || '06:00' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            uv run python -m innoknight_scheduler.browser_session --execute
          else
            uv run python -m innoknight_scheduler.browser_session
          fi
