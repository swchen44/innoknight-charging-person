# 每日充電預約 workflow（docs/design.md 場景一 Use Case 1）
#
# - 手動觸發（workflow_dispatch）：預設 dry-run，勾選 apply 才會真的寫入。
#   Phase 2 的 go/no-go 驗證就是手動觸發 dry-run。
# - 排程觸發（schedule）：Phase 4 已啟用，**兩輪備援**。
#   第一輪 UTC 07:30 = 台北 15:30（前一天下午），與離峰窗口開始時間（00:20）保留
#   約 8h50m 緩衝。2026-08-30 起實測排程觸發器延遲落在 3.5–5.8 小時（超過 GitHub
#   官方文件引用的 15 分鐘–2 小時案例，見 PDCA.md），2026-09-03 先改到 20:30
#   （緩衝 4 小時），同日再提早到 15:30——目的是讓「第二輪」在第一輪失敗時也還有
#   充分時間完成自己的重試，而不是被同樣的延遲壓縮到窗口邊緣。即使延遲把執行時間
#   推過午夜，target_date 是每次執行當下重新算的「明天」，不會因此建立錯誤日期的
#   預約（細節見 PDCA.md「延遲與 target_date 自我修正」）。
#   **權衡揭露**：15:30 是台北時間下午，對許多人的作息而言車輛可能還沒回家插上
#   充電——若近期常在這個時間點撞到 `device_not_ready`，代表觸發時間比實際回家
#   時間早太多，需要往後調整（見 design.md §4 第 1 條）。
#   第二輪 UTC 08:00 = 台北 16:00，晚 30 分鐘、緩衝約 8h20m。2026-09-03 起原自管
#   主機已停用、雲端版無後備，加第二輪是為了在同一晚內再給 reCAPTCHA／裝置就緒
#   狀態一次機會。**不需要額外的「檢查」邏輯**——`run_daily_workflow`／
#   `has_equivalent_schedule` 本身就是冪等的：第二輪執行時若第一輪已成功建立
#   明天的預約，會直接判定「已存在」並跳過，不會重複建立；若第一輪失敗，第二輪
#   就是完整重跑一次（含自己的最多 5 次登入重試）。兩輪共用同一個 concurrency
#   group，靠下方 `queue: max` 確保依序執行、互不取消（見 PDCA.md 對此設定的查證）。
#   排程觸發一律視為正式執行（--execute）。
#   充電時段：預設／Variables 為 00:20-06:00（真正離峰時段，2026-09-03 從 00:30
#   調整）。曾在辨識期暫時改為 07:00-10:00 與原自管主機的舊時段區分，供人工核對
#   雲端版是否設定成功；核對穩定後已改回離峰，原主機已於同日停用。
#
# workflow_dispatch 額外參數（target_offset_days/start_time/end_time）：一般用途的
# 覆寫參數，不限於補洞——例如想臨時測試不同時段、或某天排程失敗想補當天
# （target_offset_days=0）而非等下一輪自動排程建立的「明天」。留空則落回
# Variables/code 預設，不影響 schedule 觸發。
# 瀏覽器：預設 headful（指紋較真實，為了通過 reCAPTCHA），需要 Xvfb 提供虛擬顯示；
# 程式已自動帶入 --disable-gpu（runner 無 GPU，headful 少了它會卡 CDP 逾時，2026-08 實測）。
#
# 供應鏈規則：所有第三方 Action 釘死完整 commit SHA，permissions 最小化。
# 公開 repo 注意：本 workflow 的 log 全世界可讀；裝置名稱屬個人資訊，
# 因此放 Secrets（自動遮罩），不放 Variables。
name: daily-schedule

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "實際寫入 InnoKnight（不勾 = dry-run，只讀不寫）"
        type: boolean
        default: false
      target_offset_days:
        description: "target_date = 今天 + N 天（留空 = 預設 1，明天；0 = 今天，補洞用）"
        type: string
        default: ""
      start_time:
        description: "充電開始時間 HH:MM（留空 = 用 Variables/預設 00:20）"
        type: string
        default: ""
      end_time:
        description: "充電結束時間 HH:MM（留空 = 用 Variables/預設 06:00）"
        type: string
        default: ""
  schedule:
    - cron: "30 7 * * *"  # 第一輪：UTC = 台北 15:30（前一天下午），約 8h50m 緩衝
    - cron: "0 8 * * *"   # 第二輪備援：UTC = 台北 16:00（前一天下午），晚 30 分鐘

permissions:
  contents: read

concurrency:
  group: daily-schedule
  cancel-in-progress: false
  # 預設 queue: single 只保留「最新一個排隊中」的 run，第二輪觸發時若第一輪還在
  # 排隊（尚未真正開始跑，這在我們實測過的 3.5–5.8 小時延遲下很可能發生）就會被
  # 直接取消、由第二輪取代——等於兩輪備援互相取消，反而可能整晚只跑成一次。
  # queue: max 讓兩輪改成真正排隊依序執行，互不取消（2026-05 發布的功能，見 PDCA.md）。
  queue: max

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Install xvfb（headful 需要虛擬顯示）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Run daily charging schedule
        env:
          PYTHONUNBUFFERED: "1"
          INNOKNIGHT_USERNAME: ${{ secrets.INNOKNIGHT_USERNAME }}
          INNOKNIGHT_PASSWORD: ${{ secrets.INNOKNIGHT_PASSWORD }}
          INNOKNIGHT_DEVICE_NAME: ${{ secrets.INNOKNIGHT_DEVICE_NAME }}
          INNOKNIGHT_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # inputs.* 只在 workflow_dispatch 有值，schedule 觸發時是 null，
          # || 會安全落回 Variables → code 預設，不會讓排程觸發出錯。
          INNOKNIGHT_START_TIME: ${{ inputs.start_time || vars.INNOKNIGHT_START_TIME || '00:20' }}
          INNOKNIGHT_END_TIME: ${{ inputs.end_time || vars.INNOKNIGHT_END_TIME || '06:00' }}
          INNOKNIGHT_TARGET_OFFSET_DAYS: ${{ inputs.target_offset_days || '1' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            uv run python -m innoknight_scheduler.browser_session --execute
          else
            uv run python -m innoknight_scheduler.browser_session
          fi
