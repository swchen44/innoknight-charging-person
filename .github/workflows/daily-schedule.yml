# 每日充電預約 workflow（docs/design.md 場景一 Use Case 1）
#
# - 手動觸發（workflow_dispatch）：預設 dry-run，勾選 apply 才會真的寫入。
#   Phase 2 的 go/no-go 驗證就是手動觸發 dry-run。
# - 排程觸發（schedule）：Phase 4 已啟用。UTC 12:30 = 台北 20:30（前一晚），
#   target_date = 明天——與離峰窗口開始時間（00:30）保留 4 小時緩衝。
#   2026-08-30 起實測排程觸發器延遲落在 3.5–5.8 小時（超過 GitHub 官方文件引用的
#   15 分鐘–2 小時案例，見 PDCA.md），原本 22:05 觸發只有 2h25m 緩衝不夠，
#   2026-09-03 改為 20:30 觸發、緩衝拉高到 4 小時。即使延遲把執行時間推過午夜，
#   target_date 是每次執行當下重新算的「明天」，不會因此建立錯誤日期的預約
#   （細節見 PDCA.md「延遲與 target_date 自我修正」）。
#   排程觸發一律視為正式執行（--execute）。
#   充電時段：預設／Variables 落回 00:30-06:00（真正離峰時段）。曾在辨識期
#   暫時改為 07:00-10:00 與原自管主機的 00:30-06:00 區分，供人工核對雲端版是否
#   設定成功；核對穩定後已於 2026-09-03 改回離峰，原主機仍先不停，繼續觀察。
#
# workflow_dispatch 額外參數（target_offset_days/start_time/end_time）：一般用途的
# 覆寫參數，不限於補洞——例如想臨時測試不同時段、或某天排程失敗想補當天
# （target_offset_days=0）而非等下一輪自動排程建立的「明天」。留空則落回
# Variables/code 預設，不影響 schedule 觸發。
# 瀏覽器：預設 headful（指紋較真實，為了通過 reCAPTCHA），需要 Xvfb 提供虛擬顯示；
# 程式已自動帶入 --disable-gpu（runner 無 GPU，headful 少了它會卡 CDP 逾時，2026-08 實測）。
#
# 供應鏈規則：所有第三方 Action 釘死完整 commit SHA，permissions 最小化。
# 公開 repo 注意：本 workflow 的 log 全世界可讀；裝置名稱屬個人資訊，
# 因此放 Secrets（自動遮罩），不放 Variables。
name: daily-schedule

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "實際寫入 InnoKnight（不勾 = dry-run，只讀不寫）"
        type: boolean
        default: false
      target_offset_days:
        description: "target_date = 今天 + N 天（留空 = 預設 1，明天；0 = 今天，補洞用）"
        type: string
        default: ""
      start_time:
        description: "充電開始時間 HH:MM（留空 = 用 Variables/預設 00:30）"
        type: string
        default: ""
      end_time:
        description: "充電結束時間 HH:MM（留空 = 用 Variables/預設 06:00）"
        type: string
        default: ""
  schedule:
    - cron: "30 12 * * *"  # UTC = 台北 20:30（前一晚），與 00:30 窗口保留 4 小時緩衝

permissions:
  contents: read

concurrency:
  group: daily-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Install xvfb（headful 需要虛擬顯示）
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Run daily charging schedule
        env:
          PYTHONUNBUFFERED: "1"
          INNOKNIGHT_USERNAME: ${{ secrets.INNOKNIGHT_USERNAME }}
          INNOKNIGHT_PASSWORD: ${{ secrets.INNOKNIGHT_PASSWORD }}
          INNOKNIGHT_DEVICE_NAME: ${{ secrets.INNOKNIGHT_DEVICE_NAME }}
          INNOKNIGHT_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # inputs.* 只在 workflow_dispatch 有值，schedule 觸發時是 null，
          # || 會安全落回 Variables → code 預設，不會讓排程觸發出錯。
          INNOKNIGHT_START_TIME: ${{ inputs.start_time || vars.INNOKNIGHT_START_TIME || '00:30' }}
          INNOKNIGHT_END_TIME: ${{ inputs.end_time || vars.INNOKNIGHT_END_TIME || '06:00' }}
          INNOKNIGHT_TARGET_OFFSET_DAYS: ${{ inputs.target_offset_days || '1' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            uv run python -m innoknight_scheduler.browser_session --execute
          else
            uv run python -m innoknight_scheduler.browser_session
          fi
